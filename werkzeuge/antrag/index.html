.pv{display:none}

</style>

      c.addEventListener('change', function(){ st[l[0]] = c.value; tr.dataset.st = c.value; changed(); }); tr.dataset.st = st[l[0]] || ''; tr.appendChild(c); pv(c); tb.appendChild(tr); });
    outs.push(function(){ var g = +S.pg || 0; amt.forEach(function(a){ a[0].textContent = g ? a[1](g) : 'Pflegegrad wählen'; });
      var n = {genutzt:0, beantragt:0, offen:0}; Object.keys(st).forEach(function(k){ if (n[st[k]] !== undefined) n[st[k]]++; });
      sum.innerHTML = '<div class="row"><span>Nutzen wir schon</span><b>' + n.genutzt + '</b></div><div class="row"><span>Beantragt</span><b>' + n.beantragt + '</b></div><div class="row"><span>Noch offen</span><span class="big">' + n.offen + '</span></div>'; });
    return wrap;
  },
  cards:function(p, S, changed, outs){
    var w = el('<div class="cards"></div>'), C = [['Leitgedanke · Teil I','So viel Hilfe wie nötig – so viel eigenes Leben wie möglich.'],['Leitgedanke · Teil II','Dein Elternteil wird nicht zu deinem Kind.'],['Leitsatz · Kapitel 2','Ich muss heute nicht die gesamte Pflege lösen. Ich muss nur den nächsten verantwortbaren Schritt gehen.']];
    C.forEach(function(c){ w.appendChild(el('<div class="nk"><span class="chip">' + c[0] + '</span><p>' + c[1] + '</p></div>')); });
    var own = el('<div class="nk"><span class="chip">Mein eigener Satz</span><p></p></div>'); w.appendChild(own);
    outs.push(function(){ own.lastChild.textContent = S.eigen || '…'; });
    return w;
  },
  ideen:function(p, S, changed, outs, slug){
    var band = Q.get('band') || '', kap = Q.get('kapitel') || '';
    var notes = S.n || (S.n = []);
    var w = el('<div><div class="card"><div class="field full"><label for="neu">Neue Notiz' + (band ? ' zu ' + esc(BANDNAME[+band] || 'Band ' + band) + (kap ? ', Kapitel ' + esc(kap) : '') : '') + '</label><textarea id="neu" rows="4" placeholder="Was ist dir beim Lesen eingefallen?"></textarea></div><div class="acts" style="margin:.8rem 0 0"><button class="btn" type="button" id="add">Notiz speichern</button></div></div>' +
      '<div class="grid" style="margin-top:1rem"><div class="field"><label for="flt">Anzeigen</label><select id="flt"><option value="">alle Notizen</option><option value="1">Band 1</option><option value="2">Band 2</option></select></div></div><ul class="notes"></ul><p class="hint" id="cnt"></p></div>');
    var ta = w.querySelector('#neu'), ul = w.querySelector('.notes'), flt = w.querySelector('#flt'), cnt = w.querySelector('#cnt');
    function draw(){ ul.innerHTML = ''; var shown = notes.filter(function(n){ return !flt.value || String(n.b) === flt.value; });
      shown.slice().reverse().forEach(function(n){ var li = el('<li><small></small><p></p><button type="button">Löschen</button></li>');
        li.firstChild.textContent = n.d + (n.b ? ' · Band ' + n.b : '') + (n.k ? ' · Kapitel ' + n.k : ''); li.children[1].textContent = n.t;
        li.lastChild.addEventListener('click', function(){ notes.splice(notes.indexOf(n),1); changed(); draw(); }); ul.appendChild(li); });
      cnt.textContent = shown.length ? shown.length + (shown.length === 1 ? ' Notiz' : ' Notizen') : 'Noch keine Notizen. Deine erste Notiz erscheint hier mit Datum und Kapitel.'; }
    w.querySelector('#add').addEventListener('click', function(){ var t = ta.value.trim(); if (!t) { ta.focus(); return; } notes.push({t:t, d:new Date().toLocaleString('de-DE',{dateStyle:'medium',timeStyle:'short'}), b:band, k:kap}); ta.value = ''; changed(); draw(); });
    flt.addEventListener('change', draw); draw();
    S._text = function(){ return notes.map(function(n){ return n.d + (n.b ? ' · Band ' + n.b : '') + (n.k ? ' · Kapitel ' + n.k : '') + '\n' + n.t; }).join('\n\n'); };
    var acts = el('<div class="acts"></div>'), msg = el('<p class="msg" role="status"></p>');
    acts.appendChild(btnMail('Meine Notizen – PflegeFahrplan', function(){ return S._text(); }, msg));
    acts.appendChild(btnCopy(function(){ return S._text(); }, msg));
    acts.appendChild(btnPdf(msg)); w.appendChild(acts); w.appendChild(msg);
    return w;
  }
};

/* ============ Text für E-Mail, Kopieren ============ */
function asText(T, S){
  var out = [T.title, ''];
  T.parts.forEach(function(p){
    if (p.type === 'fields') p.fields.forEach(function(f){ var v = S[f.k]; if (v === undefined || v === '' || v === false) return; if (f.type === 'date') v = deShort(v); if (f.type === 'checkbox') v = 'ja'; if (f.type === 'select' && f.opts) { var o = f.opts.filter(function(x){ return x[0] === String(v); })[0]; v = o ? o[1] : v; } out.push(f.label + ': ' + v); });
    if (p.type === 'out' || p.type === 'letter'){ var t = D.createElement('div'); t.innerHTML = p.type === 'out' ? p.render(S).replace(/<\/span>\s*<(span|b)/g,'</span>: <$1').replace(/<\/div>/g,'\n') : esc(p.render(S)); out.push('', t.textContent.trim()); }
    if (p.type === 'check'){ out.push('', p.title); p.items.forEach(function(it,i){ out.push(((S[p.k]||[])[i] ? '[x] ' : '[ ] ') + it); }); }
    if (p.type === 'table'){ out.push(''); (S[p.k]||[]).forEach(function(r){ var cells = p.cols.map(function(c,j){ var v = r[j]; if (v === true) v = 'ja'; if (v && /^\d{4}-\d\d-\d\d$/.test(v)) v = deShort(v); return v ? c + ': ' + v : ''; }).filter(Boolean); if (cells.length) out.push('• ' + cells.join(' | ')); }); }
    if (p.type === 'leist'){ var g = +S.pg || 0; LEIST.forEach(function(l){ var st = (S.st||{})[l[0]]; out.push('• ' + l[1] + (g ? ' (' + l[2](g) + ')' : '') + ': ' + ({genutzt:'nutzen wir schon',beantragt:'beantragt',offen:'noch offen',nein:'nicht relevant'}[st] || 'nicht eingetragen')); }); }
  });
  out.push('', '– erstellt mit den Werkzeugen zur Buchreihe PflegeFahrplan');
  return out.join('\n').replace(/\n{3,}/g,'\n\n');
}
function letterText(T, S){ var p = T.parts.filter(function(x){ return x.type === 'letter'; })[0]; return p ? p.render(S) : asText(T,S); }

/* ============ Aktionen ============ */
function mk(label, cls){ var b = el('<button class="btn ' + (cls||'') + '" type="button">' + label + '</button>'); return b; }
function blocked(b, msg, what){ if (!(SANDBOX && !SITE)) return false; b.setAttribute('aria-disabled','true'); b.title = what + ' funktioniert auf der Website'; b.addEventListener('click', function(){ say(msg, what + ' ist in der Testansicht gesperrt und funktioniert auf der Website.', true); }); return true; }
function say(m, t, err){ m.textContent = t; m.classList.toggle('err', !!err); }
function btnPdf(msg){ var b = mk('📄 Als PDF speichern', 'alt'); b.dataset.act = 'pdf'; if (!blocked(b, msg, 'Als PDF speichern')) b.addEventListener('click', function(){ say(msg, 'Im Druckdialog „Als PDF sichern“ wählen.'); window.print(); }); return b; }
function btnCopy(fn, msg, label){ var b = mk(label || '📋 Text kopieren', 'alt'); b.addEventListener('click', function(){ var t = fn(); var ok = function(){ say(msg, 'Kopiert. Du kannst den Text jetzt einfügen.'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, function(){ fallbackCopy(t, msg); }); else fallbackCopy(t, msg); }); return b; }
function fallbackCopy(t, msg){ var box = el('<div class="mailbox"></div>'); box.textContent = t; msg.after(box); var r = D.createRange(); r.selectNodeContents(box); var s = getSelection(); s.removeAllRanges(); s.addRange(r); say(msg, 'Text ist markiert – jetzt kopieren.'); }
function btnMail(subject, fn, msg, label){ var b = mk(label || '✉️ Per E-Mail senden', 'alt'); b.dataset.act = 'mail';
  b.addEventListener('click', function(){ var body = fn();
    if (SANDBOX && !SITE){ var box = el('<div class="mailbox"></div>'); box.textContent = 'Betreff: ' + subject + '\n\n' + body; var old = msg.parentNode.querySelector('.mailbox'); if (old) old.remove(); msg.after(box); say(msg, 'In der Testansicht wird die E-Mail hier angezeigt. Auf der Website öffnet sich dein Mailprogramm.'); return; }
    location.href = 'mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body.slice(0, 1800)); say(msg, body.length > 1800 ? 'Dein Mailprogramm öffnet sich. Der Text war lang – nutze zusätzlich „Als PDF speichern“ und häng das PDF an.' : 'Dein Mailprogramm öffnet sich mit dem fertigen Text.'); }); return b; }

function actions(T, slug, S, changed){
  var wrap = el('<div class="noprint"><div class="acts"></div><p class="msg" role="status"></p></div>'), A = wrap.firstChild, msg = wrap.lastChild;
  var gated = [], gate = null;
  if (T.actions.some(function(a){ return a === 'copyletter' || a === 'mailletter'; })){
    gate = el('<label class="confirmbox"><input type="checkbox" id="pf-confirm"/><span>Ich habe das Schreiben geprüft und verschicke es selbst.</span></label>');
    wrap.insertBefore(gate, A);
    gate.firstChild.addEventListener('change', function(){ gated.forEach(function(b){ b.disabled = !gate.firstChild.checked; }); say(msg, gate.firstChild.checked ? '' : 'Bitte zuerst bestätigen, dass du das Schreiben geprüft hast.'); });
  }
  T.actions.forEach(function(a){
    var b;
    if (a.indexOf('call:') === 0){ b = mk('📞 Pflegekasse anrufen', 'or'); b.dataset.act = 'anrufen'; b.addEventListener('click', function(){ var t = (S[a.slice(5)]||'').replace(/[^0-9+]/g,''); if (!t){ say(msg, 'Trag zuerst die Telefonnummer der Pflegekasse ein. Sie steht auf der Krankenversicherungskarte.', true); var f = D.querySelector('[data-k=' + a.slice(5) + ']'); if (f) f.focus(); return; }
        if (SANDBOX && !SITE){ say(msg, 'Nummer zum Wählen: ' + S[a.slice(5)] + ' (in der Testansicht wird nicht gewählt).'); return; } location.href = 'tel:' + t; }); }
    else if (a === 'ics'){ b = mk('📅 In den Kalender', ''); b.dataset.act = 'kalender'; if (!blocked(b, msg, 'Die Kalenderdatei')) b.addEventListener('click', function(){ var r = T.ics(S); if (typeof r === 'string'){ say(msg, r, true); return; } download('PflegeFahrplan_' + slug + '.ics', icsText(r), 'text/calendar'); say(msg, r.length === 1 ? 'Kalenderdatei geladen. Öffne sie, um den Termin zu übernehmen.' : 'Kalenderdatei mit ' + r.length + ' Terminen geladen. Öffne sie, um die Termine zu übernehmen.'); }); }
    else if (a === 'mail'){ b = btnMail(T.mailSubject || T.title, function(){ return asText(T, S); }, msg); }
    else if (a === 'mailletter'){ b = btnMail(T.mailSubject || T.title, function(){ return letterText(T, S); }, msg, '✉️ Schreiben per E-Mail'); }
    else if (a === 'copy'){ b = btnCopy(function(){ return asText(T, S); }, msg); }
    else if (a === 'copyletter'){ b = btnCopy(function(){ return letterText(T, S); }, msg, '📋 Schreiben kopieren'); }
    else if (a === 'pdf'){ b = btnPdf(msg); }
    else if (a === 'restore'){ b = mk('↺ Muster wiederherstellen', 'ghost'); b.addEventListener('click', function(){ for (var i = 1; i <= 6; i++) S['f'+i] = MUSTER[i-1]; save(slug, S); route(); }); }
    else if (a.indexOf('vorlage:') === 0){ b = el('<a class="btn ghost" href="' + (SITE ? '/werkzeuge/' : '') + a.slice(8) + '" target="_blank" rel="noopener">🖨 Leere Druckvorlage (PDF)</a>'); }
    if (b){ if (gate && (a === 'copyletter' || a === 'mailletter')){ b.disabled = true; gated.push(b); } A.appendChild(b); }
  });
  return wrap;
}

function resetBox(slug){
  var w = el('<div class="noprint" style="margin-top:1rem"><button class="btn ghost" type="button">Eingaben in diesem Werkzeug löschen</button></div>');
  w.firstChild.addEventListener('click', function(){ if (w.querySelector('.confirm')) return; var c = el('<div class="confirm"><span>Wirklich alle Eingaben löschen?</span><button class="btn or" type="button">Ja, löschen</button><button class="btn alt" type="button">Abbrechen</button></div>');
    c.children[1].addEventListener('click', function(){ store(sk(slug), null); route(); }); c.children[2].addEventListener('click', function(){ c.remove(); }); w.appendChild(c); });
  return w;
}

function hilite(a){
  var map = {kalender:'kalender', anrufen:'anrufen', pdf:'pdf'};
  var b = D.querySelector('[data-act="' + (map[a]||a) + '"]'), f = D.getElementById('a-' + a);
  var t = f || b; if (!t) return;
  setTimeout(function(){ t.scrollIntoView({behavior:'smooth', block:'center'}); if (b) b.classList.add('pulse'); var i = f && f.querySelector('input,select,textarea'); if (i) i.focus({preventScroll:true}); }, 200);
}

window.addEventListener('hashchange', route);
route();
})();
